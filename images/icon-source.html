<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon source — single 512 square</title>
<!--
  ============================================================================
  Source for favicon-32.png (32×32) and apple-touch-icon.png (180×180).
  NOT part of the website.

  The mark fills the whole viewport, so a headless screenshot at
  --window-size=512,512 --force-device-scale-factor=2 gives exactly 1024×1024
  with no grey margin to crop. Downscale that to 180 and to 32.

  Rules from the course deck:
    · square, always the same number twice
    · PNG only (JPEG cannot be transparent and small JPEGs look smudged)
    · no rounded corners — the phone rounds the app icon itself
    · must still be readable at 32 px: one letter, one shape, no slogan
    · design large (512) and export down — never scale a small icon up
  ============================================================================
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  .mark {
    width: 100vw;
    height: 100vh;
    background: #c2410c;
    color: #fbfaf7;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .mark span {
    font-size: 88vh;              /* relative, so it scales with the square */
    line-height: .78;
    font-weight: 700;
    letter-spacing: -0.05em;
    position: relative;
    z-index: 2;
  }

  /*
    No footer band on purpose. I compared four variants at the real 32 px and the
    band only ate space and added noise; a single large letter reads best at the
    size a browser tab actually uses.
  */
</style>
</head>
<body>
  <div class="mark"><span>S</span></div>
</body>
</html>

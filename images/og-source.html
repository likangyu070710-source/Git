<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source — How to Survive Danzhou</title>
<!--
  ============================================================================
  This file is NOT part of the website. It is the source for images/og-image.jpg,
  made the way the course suggests: build a 1200 × 630 box in HTML and CSS,
  then screenshot it.

  How to export it:
    1. open this file in a browser
    2. DevTools (F12) → Ctrl+Shift+P (Cmd+Shift+P on macOS)
    3. type "Capture node screenshot"  → click the .canvas element first
    4. save the result as images/og-image.jpg

  Specs it must meet (from the project deck):
    1200 × 630 px exactly · under 100 KB · title not touching the edges
  ============================================================================
-->
<style>
  /* Same palette as the site, so the poster and the pages agree */
  :root {
    --paper: #fbfaf7;
    --ink: #12141a;
    --dim: #5b6270;
    --accent: #c2410c;
  }

  body {
    margin: 0;
    background: #8b8b8b;              /* grey surround so you can see the edges */
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, system-ui, sans-serif;
  }

  /* ---- the actual 1200 × 630 canvas ---- */
  .canvas {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    display: grid;
    align-content: center;            /* vertical centring */
    padding: 0 96px;
  }

  /* decorative: a soft warm wash in one corner, no image file needed */
  .canvas::before {
    content: "";
    position: absolute;
    right: -160px;
    top: -160px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .07;
  }
  .canvas::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 14px;
    background: var(--accent);
  }

  /* A title long enough to be cut off if it hugged the edge — this one does not. */
  .title {
    font-size: 104px;
    line-height: 1.02;
    letter-spacing: -0.03em;
    font-weight: 700;
    margin: 0 0 28px;
    max-width: 900px;
  }
  .title em {
    font-style: normal;
    color: var(--accent);
  }

  .sub {
    font-size: 38px;
    line-height: 1.35;
    color: var(--dim);
    margin: 0;
    max-width: 820px;
  }

  .foot {
    position: absolute;
    left: 96px;
    bottom: 56px;
    font-size: 26px;
    color: var(--dim);
    letter-spacing: .01em;
  }
  .foot strong { color: var(--ink); }

  /* guides: must stay inside the dashed safe area (teacher: "keep the words inside it") */
  .safe-area {
    position: absolute;
    inset: 48px;
    border: 2px dashed rgba(194, 65, 12, .35);
    pointer-events: none;
  }
</style>
</head>
<body data-export="false">

  <div class="canvas" data-og-canvas>
    <p class="title">How to <em>Survive</em><br>Danzhou</p>
    <p class="sub">A survival guide for new students — arriving, campus life, food, and getting around.</p>
    <p class="foot"><strong>SurviveDanzhou</strong> · written by a student, for the students arriving next year</p>
  </div>

</body>
</html>

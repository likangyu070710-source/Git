<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source — How to Survive Danzhou</title>
<!--
  ============================================================================
  This file is NOT part of the website. It is the source for images/og-image.jpg,
  built the way the course suggests: lay it out in HTML and CSS, then screenshot it.

  HOW TO EXPORT
    1. open this file in a browser
    2. DevTools (F12) → Ctrl+Shift+P  (Cmd+Shift+P on macOS)
    3. type "Capture node screenshot" → click the .canvas element first
    4. save as images/og-image.jpg, then check it is under 100 KB

  SPECS IT MUST MEET (from the project deck, slide 12)
    · 1200 × 630 px exactly
    · under 100 KB
    · the title must not touch the edges — some apps crop the sides

  WHY THIS LAYOUT (slide 12: "the title, big · one line on what it is · one visual")
    · left column  = title + one line describing the site
    · right column = one visual: the same "S" mark used by favicon-32.png and
      apple-touch-icon.png. Slide 16 asks for "the same colours, the same letter
      or mark" across the poster, the app icon and the favicon — so the letter
      here is deliberately the same one as in icon-source.html.
    · everything sits inside a 64-80 px margin so cropped edges cannot eat text
  ============================================================================
-->
<style>
  /* Same palette as the site, so the poster and the pages always agree */
  :root {
    --paper:  #fbfaf7;
    --ink:    #12141a;
    --dim:    #5b6270;
    --accent: #c2410c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #8b8b8b;              /* grey surround: makes the edges visible */
  }

  /* ---- the 1200 × 630 canvas that gets screenshotted ---- */
  .canvas {
    width: 1200px;
    height: 630px;
    display: flex;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- left: words ---- */
  .left {
    width: 63%;
    background: var(--paper);
    color: var(--ink);
    padding: 64px 40px 64px 80px;     /* 80 px on the crop side */
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .kicker {
    font-size: 24px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 30px;
  }

  .title {
    font-size: 92px;
    line-height: 1;
    letter-spacing: -.035em;
    font-weight: 700;
  }
  .title em {
    font-style: normal;
    color: var(--accent);
  }

  .sub {
    font-size: 28px;
    line-height: 1.42;
    color: var(--dim);
    margin-top: 30px;
    max-width: 560px;
  }

  /* ---- right: one visual, the shared "S" mark ---- */
  .right {
    width: 37%;
    background: var(--accent);
    display: grid;
    place-items: center;
    position: relative;
  }
  .mark {
    font-size: 300px;
    line-height: .78;
    font-weight: 700;
    letter-spacing: -.05em;
    color: var(--paper);
    transform: translateY(-4px);
  }
</style>
</head>
<body>

  <div class="canvas" data-og-canvas>

    <div class="left">
      <p class="kicker">BiUH · Web Technologies</p>
      <p class="title">How to<br><em>Survive</em><br>Danzhou</p>
      <p class="sub">A student's guide to the first month — and the rest of the year.</p>
    </div>

    <div class="right">
      <span class="mark">S</span>
    </div>

  </div>

</body>
</html>
